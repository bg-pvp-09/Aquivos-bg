<!DOCTYPE html>

        </div>

        <div id="Entrega">

            <input type="text" id="Yimc" readonly>
            <input type="text" id="txtImc" readonly><br><br>
            <label for="PesoId">Seu Peso Ideal:</label><br>
            <input type="text" id="PesoId" readonly><br><br><br>
            <h1 id="perPeso" ></h1>
            </label>
        </div>

        <div id="botoes">
            <input type="reset" onclick="limpar1()" id="limpar" value="Limpar">
            <input type="button" onclick="calculo()" id="calcular" value="Calcular">

        </div>

    </form>
