<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dia que nasci</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="fumo">
        <div id="coleta">

        <label for="dianasc">Informe o dia que você nasceu</label>
        <input type="text" id="dianasc"><br><br>

        <label for="mesnasc">Informe o mês que você nasceu</label>
        <input type="text" id="mesnasc"><br><br>

        <label for="anonasc">Informe o ano que você nasceu</label>
        <input type="text" id="anonasc"><br><br><br>

        </div>

        <div id="entrega">

            <label for="nomemes">Seu mês de nascimento é</label>
            <input type="text" id="nomemes" readonly><br><br>

            <label for="diasemana">Seu dia da semana foi</label>
            <input type="text" id="diasemana" readonly><br><br>

            <label for="signoimg">Seu signo é</label>
            <input type="text" id="signoimg" readonly><br><br>

            <label for="idad">E a sua idade é</label>
            <input type="text" id="idad" readonly><br><br>
            
        </div>

        <div id="butaos">

        <button type="reset">Limpar</button>
        <button type="button" id="resultad" >C</button>

        </div>


    </form>
    <script src="script.js"></script>
</body>
</html>
